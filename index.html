<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Coupon Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; margin: 0; background-color: #f4f4f9;}
    #reader { width: 100%; max-width: 400px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #result { margin-top: 20px; padding: 20px; font-size: 24px; font-weight: bold; border-radius: 8px; display: none; text-transform: uppercase; }
    .success { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .duplicate { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    .invalid { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
  </style>
</head>
<body>
  <h2>Meal Scanner</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbwr2jaFMKKLv1AWBYPRIQiwL2Fq1oUxX-u1cUelci_7ZuukSKR1XAlfqx7wmUwafN2Plg/exec'; 
    let isScanning = true;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false; 

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.innerText = 'Checking...';

      fetch(`${scriptUrl}?id=${encodeURIComponent(decodedText)}`)
        .then(response => response.json())
        .then(data => {
          resultDiv.className = data.status;
          resultDiv.innerText = data.message;

          setTimeout(() => {
            resultDiv.style.display = 'none';
            isScanning = true;
          }, 3000);
        })
        .catch(error => {
          resultDiv.className = 'invalid';
          resultDiv.innerText = 'Network Error';
          setTimeout(() => { 
            resultDiv.style.display = 'none';
            isScanning = true; 
          }, 3000);
        });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
