<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Coupon Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; margin: 0; background-color: #f4f4f9;}
    #reader { width: 100%; max-width: 400px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #result { margin-top: 20px; padding: 20px; font-size: 24px; font-weight: bold; border-radius: 8px; display: none; text-transform: uppercase; }
    .success { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .duplicate { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    .invalid { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
  </style>
</head>
<body>
  <h2>Meal Scanner</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    // PASTE YOUR NEW GOOGLE APPS SCRIPT URL BELOW
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbyHBhlD_pCkcpElgoWh8N-Zb3ScBRutmH8-JG1RZ_trSjH5n7eHr2-vUHpD4d7Zy5Ip3g/exec'; 
    let isScanning = true;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false; 

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.innerText = 'Checking...';

      // Add a 5-second timeout so it never hangs forever
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      fetch(`${scriptUrl}?id=${encodeURIComponent(decodedText)}`, { signal: controller.signal })
        .then(response => response.json())
        .then(data => {
          clearTimeout(timeoutId);
          resultDiv.className = data.status;
          resultDiv.innerText = data.message;
          setTimeout(resetScanner, 3000);
        })
        .catch(error => {
          clearTimeout(timeoutId);
          resultDiv.className = 'invalid';
          if (error.name === 'AbortError') {
             resultDiv.innerText = 'TIMEOUT: RETRYING';
          } else {
             resultDiv.innerText = 'NETWORK ERROR';
          }
          setTimeout(resetScanner, 3000);
        });
    }

    function resetScanner() {
      document.getElementById('result').style.display = 'none';
      isScanning = true; 
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
